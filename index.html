
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Reasons For You 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <main class="container">

        <p class="top-text">A LITTLE SOMETHING FOR YOU</p>

        <h1>100 Reasons<br>
            <span>You're Special</span>
        </h1>

        <p class="subtitle">
            There are so many things I love and appreciate about you...
        </p>

        <div class="jar-container">
            <div class="jar" id="jar">
                <div class="jar-lid"></div>
                <div class="jar-body">
                    <span class="jar-heart">♥</span>
                    <p>Reasons</p>
                    <p class="jar-small">for you</p>
                </div>
            </div>
        </div>

        <p class="instruction">
            Tap the jar to discover a little reason 💗
        </p>

        <button id="reasonBtn">Open a little note ✨</button>

        <div class="note" id="note">
            <p class="note-label">A little reminder for you 💌</p>
            <h2 id="reasonText">You are truly special.</h2>
        </div>

        <p class="counter" id="counter">0 / 100 reasons discovered</p>

        <footer>
            Made with love, just for you ♥
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
